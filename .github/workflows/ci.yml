# Integración continua de NovaMercado. Documentación: README.md, sección "Integración continua".
#
# Se ejecuta en cada PR hacia main (al abrirlo y con cada push a su rama) y en cada push a main.
# No despliega ni publica imágenes. No contiene credenciales:
#   * el PostgreSQL de servicio usa autenticación "trust" (solo accesible dentro del runner);
#   * la verificación con Docker Compose genera claves aleatorias en el momento y las enmascara.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  calidad:
    name: Formato y calidad (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar ruff (versión de requirements/dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements/dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github .

  pruebas:
    name: Pruebas unitarias y de regresión
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt && pip check
      - name: Verificar que no se usan datos locales
        run: test ! -e raw
      - name: pytest (calidad, contrato, ML; etapas 1-3 sin base de datos)
        run: python -m pytest -m "not integracion" -q --junitxml=reportes-ci/unitarias.xml
      - name: Resumen
        if: always()
        run: python .github/scripts/resumen_junit.py reportes-ci/unitarias.xml "Pruebas unitarias y de regresión" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-unitarias
          path: reportes-ci/
          retention-days: 14

  integracion:
    name: Pruebas de integración (PostgreSQL)
    runs-on: ubuntu-24.04
    # Incluye las de MLflow: un servidor MLflow real (proceso local, SQLite) y varios entrenamientos
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt
      - name: Migraciones (upgrade, downgrade, upgrade) en una base limpia
        env:
          DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/postgres
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic current
      - name: pytest -m integracion
        run: python -m pytest -m integracion -q --junitxml=reportes-ci/integracion.xml
      - name: Resumen
        if: always()
        run: python .github/scripts/resumen_junit.py reportes-ci/integracion.xml "Pruebas de integración" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-integracion
          path: reportes-ci/
          retention-days: 14

  airflow:
    name: DAG con Airflow 2.10.5
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Base de prueba migrada con los roles (entorno de la aplicación)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres@localhost:5432/nm_airflow
          NM_CIERRE_PASSWORD: clave-cierre-ci
          NM_VIGILANTE_PASSWORD: clave-vigilante-ci
        run: |
          pip install -r requirements/dev.txt
          psql -h localhost -U postgres -c "CREATE DATABASE nm_airflow"
          alembic upgrade head
          python -m app.db.roles
      - name: Airflow 2.10.5 con sus constraints oficiales (entorno propio, sin el proyecto)
        run: |
          python -m venv /tmp/airflow-venv
          /tmp/airflow-venv/bin/pip install "apache-airflow==2.10.5" "apache-airflow-providers-postgres" pytest \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
      - name: pytest tests/orquestacion (DagBag, estructura y tareas SQL contra PostgreSQL)
        env:
          AIRFLOW_HOME: /tmp/airflow-home
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          NM_PRUEBA_DB: "1"
          DB_HOST: localhost
          DB_PORT: "5432"
          POSTGRES_DB: nm_airflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          NM_CIERRE_PASSWORD: clave-cierre-ci
          NM_VIGILANTE_PASSWORD: clave-vigilante-ci
        run: |
          /tmp/airflow-venv/bin/python -m pytest tests/orquestacion --confcutdir=tests/orquestacion -q \
            --junitxml=reportes-ci/airflow.xml
          test "$(grep -o 'skipped="[0-9]*"' reportes-ci/airflow.xml | head -1)" = 'skipped="0"'
      - name: Resumen
        if: always()
        run: python .github/scripts/resumen_junit.py reportes-ci/airflow.xml "DAG con Airflow" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-airflow
          path: reportes-ci/
          retention-days: 14

  persistencia:
    name: Persistencia con Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt
      - name: Validar docker-compose.yml con .env.example
        run: docker compose --env-file .env.example config --quiet
      - name: Reinicio y down/up sin perder datos (producto y MLflow); bases separadas
        run: bash scripts/verificar_persistencia_docker.sh

  producto:
    name: Producto con Docker Compose (extremo a extremo)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Instalar dependencias (solo para generar los datos sintéticos)
        run: pip install -r requirements/dev.txt
      - name: Verificar que no se usan datos locales
        run: test ! -e raw
      - name: Imágenes, arranque desde cero, contrato, reinicios, MLflow caído, E-ANT, procedencia y reentrenamiento con Airflow
        run: bash scripts/verificar_producto_docker.sh

  resultado:
    name: CI resultado
    if: always()
    needs: [calidad, pruebas, integracion, airflow, persistencia, producto]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aprobar solo si todos los jobs pasaron
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "## Resultado de la CI" >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTADOS" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          filas = [f"| {k} | {v[\"result\"]} |" for k, v in r.items()]
          print("| Job | Resultado |\n|---|---|\n" + "\n".join(filas))
          sys.exit(0 if all(v["result"] == "success" for v in r.values()) else 1)
          ' | tee -a "$GITHUB_STEP_SUMMARY"
