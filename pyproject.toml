[project]
name = "novamercado-lab2"
version = "0.1.0"
description = "Servicio de pronóstico de ventas e inventario para NovaMercado"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integracion: requiere PostgreSQL (variable TEST_DATABASE_URL); ver README.md",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["raw", "reportes"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (errores reales), I: orden de imports
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Migraciones generadas por Alembic: se conservan como las generó la herramienta
"migraciones/versions/*" = ["E501"]
